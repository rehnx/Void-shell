# RehanShell Phase 1: managed Hyprland foundation.
# Keep machine-specific changes in user.conf.

monitor = , preferred, auto, 1

$mainMod = SUPER

input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 6
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

source = ./keybinds.conf
source = ./autostart.conf
source = ./user.conf
