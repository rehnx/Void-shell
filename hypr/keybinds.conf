# Essential bindings only. $mainMod is defined in hyprland.conf.
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, F, fullscreen,
bind = $mainMod, Space, togglefloating,
bind = $mainMod, R, global, quickshell:launcher
bind = $mainMod, C, global, quickshell:controlCenter
bind = $mainMod, N, global, quickshell:notifications
bind = $mainMod, M, global, quickshell:media
bind = $mainMod, D, global, quickshell:calendar
bind = $mainMod, P, global, quickshell:powerMenu
bind = $mainMod SHIFT, D, global, quickshell:developerCenter

bindel = , XF86AudioRaiseVolume, global, quickshell:volumeUp
bindel = , XF86AudioLowerVolume, global, quickshell:volumeDown
bindl = , XF86AudioMute, global, quickshell:volumeMute
bindl = , XF86AudioMicMute, global, quickshell:microphoneMute
bindel = , XF86MonBrightnessUp, global, quickshell:brightnessUp
bindel = , XF86MonBrightnessDown, global, quickshell:brightnessDown

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
